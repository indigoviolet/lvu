[tools]
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
python = "3.12.14"
node = "26.8.1"
uv = "0.12.10"
sccache = "0.17.0"
"http:chafa" = { version = "1.18.2", url = "https://hpjansson.org/chafa/releases/static/chafa-1.18.2-1-x86_64-linux-gnu.tar.gz", checksum = "sha256:deb149bc8823589f635f24db3ecc83b7daa86e4c20d8a9f58e9ce53bd97bdda9", strip_components = 1 }

[env]
# Respect a caller-exported target so a worktree builds into its own directory;
# a bare assignment here overrides the environment and silently sends every
# agent's build into the primary checkout's target.
CARGO_TARGET_DIR = "{{ env.CARGO_TARGET_DIR | default(value='/mnt/HC_Volume_106796581/lvu-build/target') }}"
RUSTC_WRAPPER = "sccache"
SCCACHE_DIR = "/mnt/HC_Volume_106796581/lvu-build/sccache"
SCCACHE_CACHE_SIZE = "10G"
CARGO_BUILD_JOBS = "2"
CARGO_INCREMENTAL = "0"
RUSTFLAGS = "-C debuginfo=0"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
PYTHONUNBUFFERED = "1"

[tasks.doctor]
description = "Verify the pinned development toolchain"
run = ["rustc --version", "cargo --version", "python --version", "node --version", "uv --version"]

[tasks."fmt:check"]
description = "Check Rust formatting after the workspace is integrated"
run = "cargo fmt --all -- --check"

[tasks."test:rust"]
description = "Run Rust workspace tests"
run = "cargo test --workspace --locked"

[tasks."lint:rust"]
description = "Lint all Rust workspace targets"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."check:rust"]
description = "Run Rust checks serially to bound compilation resource use"
run = ["mise run fmt:check", "mise run test:rust", "mise run lint:rust"]

[tasks."test:expr:python"]
description = "Validate the pinned Python expression compiler"
run = "uv run --project python --locked pytest -q python/tests"

[tasks."test:expr:rust"]
description = "Validate the native expression compatibility runner"
env = { RUSTFLAGS = "-C debuginfo=0" }
run = "cargo test --manifest-path spikes/polars-interop/Cargo.toml --locked --target-dir \"${LVU_POLARS_TARGET_DIR:-spikes/polars-interop/target}\""

[tasks."build:expr"]
description = "Build the native expression compatibility runner"
env = { RUSTFLAGS = "-C debuginfo=0" }
run = "cargo build --manifest-path spikes/polars-interop/Cargo.toml --locked --target-dir \"${LVU_POLARS_TARGET_DIR:-spikes/polars-interop/target}\""

[tasks."test:expr:interop"]
description = "Compare Python and Rust values, dtypes, partitions and diagnostics"
depends = ["build:expr"]
run = "uv run --project python --locked python spikes/polars-interop/differential.py \"${LVU_POLARS_TARGET_DIR:-spikes/polars-interop/target}/debug/lvu-polars-interop\""

[tasks."check:expr"]
description = "Run the expression acceptance checks serially"
run = ["mise run test:expr:python", "mise run test:expr:rust", "mise run test:expr:interop"]

[tasks."install:bridge"]
description = "Install the locked local Paseo bridge dependencies"
run = "npm --prefix bridge ci"

[tasks."test:bridge"]
description = "Run deterministic Paseo protocol and lifecycle tests"
run = "npm --prefix bridge test"

[tasks."build:bridge"]
description = "Build the local Paseo bridge"
run = "npm --prefix bridge run build"

[tasks."check:bridge"]
description = "Typecheck, test and build the Paseo bridge"
run = ["npm --prefix bridge run check", "mise run build:bridge"]

[tasks.preview]
description = "Run the latest independently tested local preview"
file = "scripts/preview.sh"
raw = true

[tasks."build:app"]
description = "Build the real-source log viewer"
run = "cargo build -p lvu-app --locked"

[tasks."test:pty:real"]
description = "Exercise real file/command capture and startup cleanup in a PTY"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_lvu_real_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:stdin"]
description = "Exercise piped logs with independent controlling-terminal keyboard input"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_stdin_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:gzip"]
description = "Exercise gzip detection, decoding and duplicate-free reopen through the real TUI"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_gzip_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:palette"]
description = "Exercise the command palette against live file capture"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_palette_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app" --real'

[tasks."test:pty:delight"]
description = "Exercise startup heart and nonblocking activity presentation"
depends = ["build:tui"]
run = 'uv run --project tests/pty --locked python tests/pty/test_delight_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu"'

[tasks."test:pty:title"]
description = "Check persistent startup, consumed key entry and CLI source bypass"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_startup_title_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:settings"]
description = "Check XDG settings save, theme preview and restart restoration"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_settings_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."build:tui"]
description = "Build the TUI executable"
run = "cargo build -p lvu --locked"

[tasks."test:pty"]
description = "Exercise the real TUI in a pseudo-terminal"
depends = ["build:tui"]
run = 'uv run --project tests/pty --locked python tests/pty/test_lvu_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu"'

[tasks."test:pty:search"]
description = "Exercise debounced raw/field/regex/Polars searches and rapid clear"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_search_race_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:enrichment"]
description = "Exercise iterative regex and Polars enrichment with restart"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_enrichment_chain_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:command-enrichment"]
description = "Verify reviewed command delivery, durable results, pending arrivals and rollback"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_command_enrichment_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:horizontal"]
description = "Exercise horizontal event scrolling and reset"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_horizontal_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:extracted-time"]
description = "Check enriched timestamp filtering, arrivals, selected anchor and restart"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_extracted_time_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:source-control"]
description = "Check explicit source stop/restart, file resume and command reaping"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_source_control_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:context"]
description = "Verify raw context without replacing the active filter"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_context_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:recipe-export"]
description = "Verify portable recipe export and import in another workspace"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_recipe_export_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:bookmarks"]
description = "Verify bookmarks, notes and hidden-record context across restarts"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_bookmarks_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."bench:live"]
description = "Measure real capture, historical queries and small-cache paging"
run = 'cargo test -p lvu-app -p lvu-view measure_capture_and_historical --locked -- --ignored --nocapture'

[tasks."test:pty:recipe-history"]
description = "Verify explicit recipe updates and immutable history across restart"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_recipe_history_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:ssh"]
description = "Exercise context/bookmarks through an isolated localhost OpenSSH daemon"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_ssh_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."bench:live:sustained"]
description = "Measure two minutes of paced capture, native queries and small-cache paging"
run = 'cargo test -p lvu-app -p lvu-view measure_sustained_capture --locked -- --ignored --nocapture'

[tasks."test:pty:merged"]
description = "Verify ordered merged views, shared capture and explicit-source restoration"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_merged_views_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'


[tasks."test:pty:time-field"]
description = "Verify declaring a recognized timestamp field, its held assumption and its restart"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_time_field_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'


[tasks."test:pty:dialog-system"]
description = "Verify the dialog scrim, input tone, size classes and hitboxes wide and narrow"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_dialog_system_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:copy"]
description = "Verify dialog and log text selection, clipboard output and enrichment replacement"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_text_selection_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:redraw"]
description = "Verify resize round-trip invalidation, live arrivals and explicit redraw recovery"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_redraw_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."art:preview"]
description = "Play converted title ANSI art; Escape exits (80x22 terminal minimum)"
run = "python scripts/play-ansi-animation.py assets/startup/love-you-log-time/80x22-sharp/animation.toml"

[tasks."art:preview:large"]
description = "Play large converted title ANSI art; Escape exits (120x40 minimum)"
run = "python scripts/play-ansi-animation.py assets/startup/love-you-log-time/120x40-sharp/animation.toml"

[tasks."test:pty:help"]
description = "Verify grouped help, modal scrolling and source/discovery shortcut presentation"
depends = ["build:tui"]
run = 'uv run --project tests/pty --locked python tests/pty/test_help_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu"'

[tasks.janitor]
description = "Reclaim stale cargo artifacts and abandoned PTY scratch"
run = "python scripts/janitor.py"

[tasks."janitor:dry"]
description = "Report reclaimable build and test scratch without deleting"
run = "python scripts/janitor.py --dry-run"

[tasks."disk:check"]
description = "Fail early when either build disk is too full to trust a build"
# The volume holds every worktree's target and the soak's generated inputs, so
# it fills from work nobody in this checkout started. Checking only the
# configured target directory missed that: the volume hit 100% while this said
# the disk was fine.
run = """
status=0
seen=""
for path in "${CARGO_TARGET_DIR:-/tmp}" /mnt/HC_Volume_106796581/lvu-build; do
  [ -d "$path" ] || continue
  mount=$(df --output=target "$path" | tail -1)
  case " $seen " in *" $mount "*) continue ;; esac
  seen="$seen $mount"
  free=$(df --output=avail -BG "$path" | tail -1 | tr -dc '0-9')
  echo "${free}G free on $mount"
  if [ "$free" -lt 6 ]; then
    echo "Under 6G free on $path. Run 'mise run janitor' before building." >&2
    status=1
  fi
done
exit $status
"""

[tasks."test:pty:json"]
description = "Verify automatic JSON key/value colouring in an actual terminal"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_json_highlighting_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:correlation"]
description = "Verify cross-source field correlation, explicit per-source mapping and its restart"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_correlation_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks.soak]
description = "Short mixed-workload soak: memory, disk growth, query latency, shutdown"
depends = ["build:app", "build:tui"]
run = 'uv run --project tests/pty --locked python tests/soak/soak.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app" --mode short'

[tasks."soak:long"]
description = "Full soak over a multi-GB source; minutes to hours, not part of any gate"
depends = ["build:app", "build:tui"]
run = 'uv run --project tests/pty --locked python tests/soak/soak.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app" --mode long'

[tasks."soak:slow-terminal"]
description = "Drive lvu through a 200ms, 64-byte-chunk terminal link"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/soak/slow_terminal.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:matrix"]
description = "Run every PTY suite concurrently and report the pass/fail matrix"
depends = ["build:app", "build:tui"]
run = 'python scripts/pty-matrix.py --workers 4 --target "${CARGO_TARGET_DIR:-target}/debug"'
