[tools]
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
python = "3.12.14"
node = "26.8.1"
uv = "0.12.10"

[env]
CARGO_BUILD_JOBS = "2"
CARGO_INCREMENTAL = "0"
RUSTFLAGS = "-C debuginfo=0"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
PYTHONUNBUFFERED = "1"

[tasks.doctor]
description = "Verify the pinned development toolchain"
run = ["rustc --version", "cargo --version", "python --version", "node --version", "uv --version"]

[tasks."fmt:check"]
description = "Check Rust formatting after the workspace is integrated"
run = "cargo fmt --all -- --check"

[tasks."test:rust"]
description = "Run Rust workspace tests"
run = "cargo test --workspace --locked"

[tasks."lint:rust"]
description = "Lint all Rust workspace targets"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."check:rust"]
description = "Run Rust checks serially to bound compilation resource use"
run = ["mise run fmt:check", "mise run test:rust", "mise run lint:rust"]

[tasks."test:expr:python"]
description = "Validate the pinned Python expression compiler"
run = "uv run --project python --locked pytest -q python/tests"

[tasks."test:expr:rust"]
description = "Validate the native expression compatibility runner"
env = { RUSTFLAGS = "-C debuginfo=0" }
run = "cargo test --manifest-path spikes/polars-interop/Cargo.toml --locked --target-dir \"${LVU_POLARS_TARGET_DIR:-spikes/polars-interop/target}\""

[tasks."build:expr"]
description = "Build the native expression compatibility runner"
env = { RUSTFLAGS = "-C debuginfo=0" }
run = "cargo build --manifest-path spikes/polars-interop/Cargo.toml --locked --target-dir \"${LVU_POLARS_TARGET_DIR:-spikes/polars-interop/target}\""

[tasks."test:expr:interop"]
description = "Compare Python and Rust values, dtypes, partitions and diagnostics"
depends = ["build:expr"]
run = "uv run --project python --locked python spikes/polars-interop/differential.py \"${LVU_POLARS_TARGET_DIR:-spikes/polars-interop/target}/debug/lvu-polars-interop\""

[tasks."check:expr"]
description = "Run the expression acceptance checks serially"
run = ["mise run test:expr:python", "mise run test:expr:rust", "mise run test:expr:interop"]

[tasks."install:bridge"]
description = "Install the locked local Paseo bridge dependencies"
run = "npm --prefix bridge ci"

[tasks."test:bridge"]
description = "Run deterministic Paseo protocol and lifecycle tests"
run = "npm --prefix bridge test"

[tasks."build:bridge"]
description = "Build the local Paseo bridge"
run = "npm --prefix bridge run build"

[tasks."check:bridge"]
description = "Typecheck, test and build the Paseo bridge"
run = ["npm --prefix bridge run check", "mise run build:bridge"]

[tasks.preview]
description = "Run the latest independently tested local preview"
run = "./previews/latest/lvu"

[tasks."build:app"]
description = "Build the real-source log viewer"
run = "cargo build -p lvu-app --locked"

[tasks."test:pty:real"]
description = "Exercise real file/command capture and startup cleanup in a PTY"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_lvu_real_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app"'

[tasks."test:pty:palette"]
description = "Exercise the command palette against live file capture"
depends = ["build:app"]
run = 'uv run --project tests/pty --locked python tests/pty/test_palette_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu-app" --real'

[tasks."build:tui"]
description = "Build the TUI executable"
run = "cargo build -p lvu --locked"

[tasks."test:pty"]
description = "Exercise the real TUI in a pseudo-terminal"
depends = ["build:tui"]
run = 'uv run --project tests/pty --locked python tests/pty/test_lvu_pty.py "${CARGO_TARGET_DIR:-target}/debug/lvu"'
