# Build per-target relocatable lvu archives and publish them with checksums.
#
# Every archive is built and verified by packaging/stage.sh on a machine that
# can run it: stage.sh executes the staged binary, resolves its resources
# through a symlink, compiles a real Polars expression with the staged helper
# and starts the staged bridge. A job that cannot run its own artifact fails.
#
# Job-level `continue-on-error` is deliberately absent, but `fail-fast` is off:
# one platform failing must not cancel the others, because a release that ships
# Linux only is better than no release. What must never happen is a release
# whose checksums do not match its archives, so `publish` runs once, after every
# archive job, over the artifacts they actually produced.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify archives without publishing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  archive:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # mise.toml points these at the development host's build volume, which no
    # runner has; each is written to respect a caller-exported value. sccache
    # is disabled rather than redirected: cargo reads an empty RUSTC_WRAPPER as
    # "no wrapper", and a cache created fresh on a throwaway machine never hits.
    env:
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships musl, not glibc. A glibc archive inherits the runner's
          # glibc version: an ubuntu-24.04 build refuses to start on Debian 12,
          # Ubuntu 22.04 and RHEL 9, all of which are current. Building on an
          # older runner is not a durable answer either, because ubuntu-22.04
          # begins deprecation on 2026-09-17. musl links statically and depends
          # on no system libc at all. See docs/distribution.md.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          # arm64 Linux builds natively on GitHub's arm64 runner rather than
          # cross-compiling, because stage.sh verifies an archive by running
          # it: a cross-built archive could not be executed here and the job
          # would prove nothing. These runners are free for public
          # repositories.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # The Darwin archive is executed on a native GitHub runner. Human
          # Mac acceptance is still outstanding; it is unsigned and
          # unnotarized. Release notes and the formula record these limits.
          # Intel macOS left the supported set (Linux x86_64/arm64 and
          # Apple-silicon macOS only); no x86_64-apple-darwin row exists.
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The tag must name the version the archives will carry
        if: startsWith(github.ref, 'refs/tags/v')
        # stage.sh names every archive from crates/lvu-app's version, while the
        # formula and the release URL are built from the tag. Tagging v0.1.1
        # without bumping the crate would publish lvu-0.1.0-*.tar.gz under a
        # v0.1.1 release and every download URL would 404.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/lvu-app/Cargo.toml | head -1)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match crates/lvu-app version $version" >&2
            exit 1
          fi

      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        # Rust ships the musl libc itself, but Polars pulls in C dependencies
        # (zstd-sys, lz4-sys) that need a C compiler targeting musl.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          experimental: true

      - name: Add the Rust target
        run: mise exec -- rustup target add "${{ matrix.target }}"

      - name: Build the bridge
        # A bare checkout has no node_modules, so tsc is not on PATH, and
        # stage.sh refuses to stage without bridge/dist/cli.js: this is the
        # step that makes the archive complete rather than an optional extra.
        #
        # build:bridge, not check:bridge. `tsc -p tsconfig.json` typechecks
        # what it compiles, so the build still cannot emit broken output, but
        # the bridge's vitest suite asserts 50ms operation budgets that a
        # loaded shared runner misses: it failed here with LEDGER_TIMEOUT on
        # three tests that pass locally. A release reproduces an artifact; the
        # development gate runs the suite.
        run: |
          mise run install:bridge
          mise run build:bridge

      - name: Stage and verify the archive
        env:
          # `runner` is not a named value in job-level env, so the target
          # directory is set here, on the only step that runs cargo.
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          # One of these matches the target being built; the other is unread.
          # Both name the native musl-gcc, because each musl target is built
          # on a runner of its own architecture.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          mise exec -- packaging/stage.sh \
            --target "${{ matrix.target }}" \
            --out "$RUNNER_TEMP/packaging" \
            --archive

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: lvu-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/packaging/*.tar.gz
            ${{ runner.temp }}/packaging/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: archive
    # A workflow_dispatch run never publishes; it exists to prove the archives
    # build. A tag push publishes a draft unless dry_run was explicitly asked
    # for, which is why the input is checked rather than ignored.
    # `needs.archive.result` collapses the whole matrix to one value, so
    # requiring success there would drop the Linux release whenever a Darwin
    # runner failed. Publishing instead runs over whatever artifacts exist and
    # fails if there are none.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        # Only over the archives this run actually produced. A platform whose
        # job failed is absent here and must be absent from the formula too;
        # packaging/homebrew/render-formula.sh refuses to render a checksum it
        # cannot find rather than carrying a stale one forward.
        run: |
          cd artifacts
          ls ./*.tar.gz >/dev/null || {
            echo "every archive job failed; there is nothing to publish" >&2
            exit 1
          }
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Publish the draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          draft: true
          body: |
            Install with Homebrew or mise; see docs/release-runbook.md.

                brew trust indigoviolet/tap
                brew install indigoviolet/tap/lvu

                mise use -g github:indigoviolet/lvu@VERSION

            Homebrew 6 needs the `brew trust` line before it will load a
            third-party tap. mise hides releases younger than 24 hours from
            `latest`, so name the version until this one is a day old.

            Linux archives are static musl builds and depend on no system libc.

            **Human macOS acceptance remains outstanding.** The Apple-silicon
            archive is built and executed on a native GitHub runner, unsigned
            and unnotarized. Intel macOS is not shipped.
            Report anything that does not work rather than assuming it is expected.

            Optional features have prerequisites the archive does not bundle:
            `uv` for advanced Polars expressions and `node` plus an
            authenticated agent CLI for assistance. `lvu --resources` reports
            what resolved and what is missing.
