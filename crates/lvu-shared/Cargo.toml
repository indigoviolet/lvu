[package]
name = "lvu-shared"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[dependencies]
lvu-core = { path = "../lvu-core" }
lvu-ingest = { path = "../lvu-ingest" }
lvu-memory = { path = "../lvu-memory" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
libc = "=0.2.189"
tokio = { version = "=1.53.1", features = ["sync", "net", "time", "io-util", "rt"] }
uuid = { version = "=1.26.0", features = ["serde", "v4", "v5"] }

[dev-dependencies]
tempfile = "=3.27.0"
