[package]
name = "lvu"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
crossterm = { version = "=0.29.0", features = ["osc52", "use-dev-tty"] }
lvu-core = { path = "../lvu-core" }
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
# Span highlighting re-locates a search or rule match inside the line it is
# about to draw. Pinned to the version `lvu-view` already resolves, so the
# terminal and the query engine agree on what a pattern means.
regex = "=1.13.1"
unicode-width = "=0.2.2"

# `terminal.rs` hands crossterm a private non-blocking view of the terminal so
# a partially delivered escape sequence cannot wedge its read loop; see
# `src/input.rs`. crossterm already builds on this exact rustix version.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "stdio", "termios"] }

[dev-dependencies]
pretty_assertions = "=1.4.1"
