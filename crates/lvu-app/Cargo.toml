[package]
name = "lvu-app"
version = "0.1.8"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[dependencies]
fs2 = "=0.4.3"
toml = "=1.1.5"
thiserror = "=2.0.20"
lvu = { path = "../lvu" }
lvu-command-enrich = { path = "../lvu-command-enrich" }
lvu-core = { path = "../lvu-core" }
lvu-discovery = { path = "../lvu-discovery" }
lvu-ingest = { path = "../lvu-ingest" }
lvu-live = { path = "../lvu-live" }
lvu-memory = { path = "../lvu-memory" }
lvu-query = { path = "../lvu-query" }
lvu-view = { path = "../lvu-view" }
lvu-shared = { path = "../lvu-shared" }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.26.0", features = ["v5"] }

# musl's allocator is markedly slower than glibc's under Polars' allocation
# pattern: the same 50000-record literal scan measured 205ms against musl's
# malloc and 97ms against glibc. The Linux release target is musl (see
# docs/distribution.md), so the static build supplies its own allocator rather
# than shipping that regression. Only the musl build is affected; a glibc or
# Darwin build keeps the system allocator it already had.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "=0.1.52"

[dev-dependencies]
tempfile = "=3.27.0"
