[package]
name = "lvu-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[dependencies]
lvu = { path = "../lvu" }
lvu-core = { path = "../lvu-core" }
lvu-discovery = { path = "../lvu-discovery" }
lvu-ingest = { path = "../lvu-ingest" }
lvu-live = { path = "../lvu-live" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.26.0", features = ["v5"] }

[dev-dependencies]
tempfile = "=3.27.0"
