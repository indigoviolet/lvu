[package]
name = "lvu-memory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# renameat2 is issued as a direct syscall; see store.rs.
libc = "=0.2.189"
fs2 = "=0.4.3"
hex = "=0.4.3"
lvu-core = { path = "../lvu-core" }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
toml = "=1.1.5"
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
