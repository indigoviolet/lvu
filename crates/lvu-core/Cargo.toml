[package]
name = "lvu-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crc32fast = "=1.5.1"
fs2 = "=0.4.3"
flate2 = "=1.1.10"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
