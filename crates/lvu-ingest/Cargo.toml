[package]
name = "lvu-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[dependencies]
lvu-core = { path = "../lvu-core" }
fs2 = "=0.4.3"
flate2 = "=1.1.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
