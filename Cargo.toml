[workspace]
members = ["crates/lvu-core", "crates/lvu-discovery", "crates/lvu", "crates/lvu-query", "crates/lvu-ingest"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
